<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Study Mate AI — Sign in</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">Study Mate <span>AI</span></div>
    <p style="margin-top:2px;">Upload. Scan. Revise smarter.</p>

    <div class="auth-toggle">
      <button id="tabLogin" class="active" type="button">Sign in</button>
      <button id="tabSignup" type="button">Create account</button>
    </div>

    <form id="authForm">
      <div id="nameField" style="display:none;">
        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Your name" />
      </div>

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="you@example.com" required />

      <label for="password">Password</label>
      <input type="password" id="password" placeholder="At least 6 characters" required />

      <div class="error-text" id="errorText"></div>

      <button type="submit" class="btn btn-primary" style="width:100%; justify-content:center;" id="submitBtn">
        Sign in
      </button>
    </form>
  </div>
</div>

<script type="module">
  import { auth, db } from "./js/firebase-config.js";
  import {
    createUserWithEmailAndPassword,
    signInWithEmailAndPassword,
    updateProfile
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  let mode = "login";
  const tabLogin = document.getElementById("tabLogin");
  const tabSignup = document.getElementById("tabSignup");
  const nameField = document.getElementById("nameField");
  const submitBtn = document.getElementById("submitBtn");
  const errorText = document.getElementById("errorText");
  const form = document.getElementById("authForm");

  function setMode(m) {
    mode = m;
    tabLogin.classList.toggle("active", m === "login");
    tabSignup.classList.toggle("active", m === "signup");
    nameField.style.display = m === "signup" ? "block" : "none";
    submitBtn.textContent = m === "signup" ? "Create account" : "Sign in";
    errorText.textContent = "";
  }

  tabLogin.addEventListener("click", () => setMode("login"));
  tabSignup.addEventListener("click", () => setMode("signup"));

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorText.textContent = "";
    submitBtn.disabled = true;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const name = document.getElementById("name").value.trim();

    try {
      if (mode === "signup") {
        const cred = await createUserWithEmailAndPassword(auth, email, password);
        if (name) await updateProfile(cred.user, { displayName: name });
        await setDoc(doc(db, "users", cred.user.uid), {
          name: name || email.split("@")[0],
          email,
          createdAt: serverTimestamp()
        });
      } else {
        await signInWithEmailAndPassword(auth, email, password);
      }
      window.location.href = "index.html";
    } catch (err) {
      errorText.textContent = friendlyError(err.code);
      submitBtn.disabled = false;
    }
  });

  function friendlyError(code) {
    const map = {
      "auth/email-already-in-use": "That email is already registered — try signing in instead.",
      "auth/invalid-email": "Enter a valid email address.",
      "auth/weak-password": "Password should be at least 6 characters.",
      "auth/user-not-found": "No account found with that email.",
      "auth/wrong-password": "Incorrect password.",
      "auth/invalid-credential": "Email or password is incorrect."
    };
    return map[code] || "Something went wrong. Please try again.";
  }
</script>
</body>
</html>
